<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orca</title>
    <!-- The theme first, so the page never draws in the wrong one
         (js/theme.js has the rest). -->
    <script>
        (function () {
            var choice = localStorage.getItem('orca-theme');
            if (choice !== 'light' && choice !== 'dark') {
                choice = matchMedia('(prefers-color-scheme: light)').matches
                    ? 'light' : 'dark';
            }
            document.documentElement.dataset.theme = choice;
        })();
    </script>
    <link rel="icon" href="/static/orca-gear-logo-dark.svg"
        type="image/svg+xml">
    <link rel="stylesheet" href="/static/vendor/xterm.css">
    <link rel="stylesheet" href="/static/style.css">
    <!-- xterm.js ships as a classic script: defines window.Terminal and
         window.FitAddon. -->
    <script src="/static/vendor/xterm.js"></script>
    <script src="/static/vendor/xterm-addon-fit.js"></script>
    <!-- Everything is served locally: the competition network has no
         internet. -->
    <script type="importmap">
        {
            "imports": {
                "preact": "/static/vendor/preact.module.js",
                "preact/hooks": "/static/vendor/preact-hooks.module.js",
                "htm": "/static/vendor/htm.module.js"
            }
        }
    </script>
    <script type="module" src="/static/app.js"></script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
