<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 576">
  <!-- Cardinal Space Mining logo, redrawn for dark backgrounds (light gear).
       Replace with the official vector artwork if available. -->
  <circle cx="168" cy="432" r="58" fill="#8e9096"/>
  <g transform="translate(282 290)" fill="#ececee">
    <circle r="160"/>
    <g id="tooth"><path d="M-38 -150 L-31 -198 L31 -198 L38 -150 Z"/></g>
    <use href="#tooth" transform="rotate(45)"/>
    <use href="#tooth" transform="rotate(90)"/>
    <use href="#tooth" transform="rotate(135)"/>
    <use href="#tooth" transform="rotate(180)"/>
    <use href="#tooth" transform="rotate(225)"/>
    <use href="#tooth" transform="rotate(270)"/>
    <use href="#tooth" transform="rotate(315)"/>
  </g>
  <circle cx="420" cy="190" r="86" fill="#f5a623"/>
  <circle cx="282" cy="290" r="128" fill="#16171a"/>
  <circle cx="282" cy="290" r="122" fill="#ffffff"/>
  <circle cx="282" cy="290" r="114" fill="#c8202f"/>
  <!-- Soft highlight on the planet's upper left -->
  <path d="M190 250 C 205 200, 250 178, 300 180 C 262 196, 228 222, 212 262 Z"
        fill="#e04450" opacity="0.7"/>
  <!-- Orbit: sweeps across the planet, loops through the amber moon and
       comes back as an arrow -->
  <path d="M206 372 C 300 330, 410 262, 462 205 C 494 170, 470 150, 428 182"
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M400 194 L428 170 L432 198 Z" fill="#ffffff"/>
</svg>
